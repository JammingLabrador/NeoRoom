<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Board - Neon Edition</title>
    <style>
        :root {
            --bg-color: #0b0e0f;
            --slab-color: #161b1d;
            --widget-bg: #1c2326;
            --accent-color: #00ffcc; /* The requested theme color */
            --text-primary: #e0fcf7;
            --text-secondary: #809a95;
            --border-color: #2a3538;
            --glow-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* The Special Slab Heading */
        .header-slab {
            background-color: var(--slab-color);
            width: 100%;
            max-width: 650px;
            padding: 3rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6), var(--glow-shadow);
            border: 1px solid var(--border-color);
            border-top: 5px solid var(--accent-color);
            margin-bottom: 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-slab::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 255, 204, 0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .header-slab h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        /* Comment Board Container */
        .board-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Reusable Comment Widget */
        .comment-widget {
            background-color: var(--widget-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .comment-widget:hover {
            transform: scale(1.02);
            border-color: var(--accent-color);
            box-shadow: var(--glow-shadow);
        }

        .username {
            font-weight: 700;
            color: var(--accent-color);
            font-size: 1.25rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .username::before {
            content: "";
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .comment-text {
            line-height: 1.7;
            color: var(--text-primary);
            margin: 0;
            font-size: 1.25rem;
            opacity: 0.9;
        }

        .timestamp {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 15px;
            display: block;
            font-style: italic;
        }

        /* Subtle scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
    </style>
</head>
<body>

    <header class="header-slab">
        <h1>Comment Board</h1>
    </header>

    <main class="board-container">
        
        <!-- Widget Instance 1 -->
        {% for item in comment_username %}
            <article class="comment-widget">
                <span class="username">{{ item[1] }}</span>
                <p class="comment-text">{{ item[0] }}</p>
            </article>
        {% endfor %}



    </main>

</body>
</html>
